<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>FollowUp Autopilot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #FAFAF8;
      }
      
      /* View Transitions */
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 0.4s;
        animation-timing-function: ease-in-out;
      }

      /* Custom Scrollbar */
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Dark Mode Scrollbars - Black & Green */
      .dark ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      .dark ::-webkit-scrollbar-track {
        background: #000000;
        border-left: 1px solid #111;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: rgba(74, 222, 128, 0.15); /* Green-400 low opacity */
        border-radius: 10px;
        border: 2px solid #000000;
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: rgba(74, 222, 128, 0.4);
      }

      /* Keyframe Animations */
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
      }
      
      @keyframes shimmer {
        0% { background-position: -1000px 0; }
        100% { background-position: 1000px 0; }
      }

      @keyframes gradient-rotate {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      @keyframes ping-slow {
        75%, 100% {
          transform: scale(1.5);
          opacity: 0;
        }
      }

      /* Utility Classes for Animations */
      .animate-float {
        animation: float 6s ease-in-out infinite;
      }
      
      .animate-shimmer {
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        background-size: 1000px 100%;
        animation: shimmer 2s infinite;
      }

      .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
      
      /* Dark Mode Black Glass */
      .dark .glass-panel {
        background: rgba(5, 5, 5, 0.7);
        backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(74, 222, 128, 0.1);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
      }

      /* 3D Preserves */
      .preserve-3d {
        transform-style: preserve-3d;
      }

      /* Print Styles for PDF Export */
      @media print {
        @page { size: landscape; margin: 0.5cm; }
        body { background-color: white !important; color: black !important; }
        /* Hide everything by default when printing */
        body > div > div { display: none !important; } 
        /* Show Whiteboard container when it's open (it is a fixed overlay) */
        .fixed.inset-0.z-50.bg-gradient-to-br { 
          position: absolute !important; 
          display: block !important; 
          background: white !important; 
          width: 100% !important;
          height: auto !important;
          overflow: visible !important;
        }
      }
    </style>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#FFB380', // Light Orange
              primaryDark: '#ff9c5e',
              secondary: '#FFFFFF',
              success: '#A7D8A0', // Light Green
              info: '#C9B8E8',    // Light Purple
              urgent: '#FF9494',  // Light Red
              textMain: '#1F2937',
              textSub: '#6B7280',
              bgMain: '#FAFAF8',
              // Custom Dark Theme Colors (Neon Green Accent)
              neonGreen: '#4ade80', 
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'ping-slow': 'ping-slow 2s cubic-bezier(0, 0, 0.2, 1) infinite',
            }
          }
        }
      }
    </script>
